name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore SmartBudgett.API.slnx

      - name: Build
        run: dotnet build SmartBudgett.API.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test SmartBudgett.Tests/SmartBudgett.Tests.csproj --configuration Release --no-build --verbosity normal
